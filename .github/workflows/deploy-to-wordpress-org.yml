name: Deploy to WordPress.org

# Triggers the workflow when a new release is published.
on:
  release:
    types: [published]

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is
# mutable and can be repointed by whoever controls the action's repository, and
# this workflow holds the wordpress.org SVN credentials, so a moved tag here is
# a credential-disclosure vector. The trailing comment on each line records the
# human-readable version the SHA corresponds to.
jobs:
  # Runs the same gates every pull request has to pass, plus the release tag
  # check. Publishing cannot be undone: the version number is burned on
  # wordpress.org and the only remedy is another release.
  pre-release-checks:
    name: Pre-release
    uses: ./.github/workflows/pre-release-checks.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  # Re-runs the unit suite across the full supported PHP range. The regular unit
  # test workflow is not triggered by a release event, so this is not a
  # duplicate of it.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.5']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ matrix.php-version }}
        tools: composer

    - name: Install dependencies
      run: composer install

    - name: Run tests
      run: make unit-test

  # Deploys new releases to wordpress.org.
  #
  # Perform the following steps:
  # - Checks out the repository.
  # - Deploys the plugin to wordpress.org.
  # - Uploads the release assets.

  tag:
    name: New release
    runs-on: ubuntu-latest
    needs: [pre-release-checks, test]

    # Attaching the zip to the release is the only thing here that writes to
    # this repository; the wordpress.org push authenticates with SVN secrets
    # instead. Stated explicitly so the release job is not running on whatever
    # the repository default happens to be.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Deploy plugin to wordpress.org
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
      with:
        generate-zip: true
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: 'sucuri-scanner' # WordPress.org plugin's slug

    # gh is preinstalled on the runner, so uploading the asset needs no
    # third-party action in the job that holds the wordpress.org credentials.
    # --clobber lets a re-run replace an asset a previous attempt uploaded.
    - name: Upload release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
        ZIP_PATH: ${{ steps.deploy.outputs.zip-path }}
      run: gh release upload "$TAG" "$ZIP_PATH" --clobber
